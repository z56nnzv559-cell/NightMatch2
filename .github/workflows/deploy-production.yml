name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to apply production D1 migrations and deploy"
        required: true
        type: string

concurrency:
  group: nightmatch-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Verify application
        run: npm run verify

      - name: Apply production D1 migrations
        run: npm run db:migrate

      - name: Deploy NightMatch to Cloudflare Workers
        run: npm run deploy

      - name: Deployment summary
        if: success()
        run: |
          echo "### NightMatch production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 migrations applied to: akari" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker deployed from commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
